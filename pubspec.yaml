name: reels_saver
description: "Video downloader app - save to gallery or Google Drive"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Networking
  dio: ^5.4.0

  # Local storage (theme preference)
  shared_preferences: ^2.2.2

  # Save video to device gallery
  gallery_saver_plus: ^3.2.4

  # File system paths
  path_provider: ^2.1.2

  # Permissions (Android storage/photos)
  permission_handler: ^11.3.0

  # Google Sign-In + Drive upload
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.0

  # Nice fonts (optional, pink/white theme pairs well with rounded fonts)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
