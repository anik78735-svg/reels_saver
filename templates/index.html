<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        * {

            padding: 0;

        body {

            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #888;
            margin-top: 10px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #8b5cf6;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-group input, .input-group textarea {
            flex: 1;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            min-width: 200px;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        .btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #333;
        }
        .btn-secondary:hover {
            background: #444;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-drive {
            background: #4285f4;
        }
        .btn-drive:hover {
            background: #3367d6;
        }
        .btn-gallery {
            background: #f59e0b;
        }
        .btn-gallery:hover {
            background: #d97706;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .button-group .btn {
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        #result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        #result.success {
            display: block;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }
